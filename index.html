    <script>
      // Apply the visitor's saved theme before first paint, so dark-mode users
      // never see a flash of the light page.
      try {
        if (localStorage.getItem('mago-labs-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      // Visitors outside India see their own currency's prices. Mark the page
      // before it paints so the rupee price never flashes first.
      try {
        var zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (zone && zone !== 'Asia/Kolkata' && zone !== 'Asia/Calcutta') {
          document.documentElement.setAttribute('data-currency', 'intl');
        }
      } catch (e) {}
    </script>
    <script>
      // Section headings fade in on scroll. Only hide them first when motion is
      // welcome, and show everything anyway if the page code is slow to arrive.
      try {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('motion-ok');
          setTimeout(function () { document.documentElement.classList.add('reveal-all'); }, 4000);
        }
      } catch (e) {}
    </script>
