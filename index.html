    <!-- Google tag (gtag.js) - the config call is skipped on localhost/local previews so
         local development and the build's own prerendering pass (scripts/prerender-content.ts,
         which loads every page in a real headless browser to snapshot its HTML) never send
         real events into the production GA4 property. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-57YSJ5SYSV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        gtag('config', 'G-57YSJ5SYSV');
      }
    </script>
